[package]
name = "zarathustra"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "zarathustra-probe"
path = "src/main.rs"

[features]
emulator = ["zarathustra-device/emulator"]

[dependencies]
zarathustra-device = { path = "../zarathustra-device" }
zarathustra-engine = { path = "../zarathustra-engine" }
zarathustra-store = { path = "../zarathustra-store" }
anyhow = "1"
qrcode = { version = "0.14.1", default-features = false }
percent-encoding = "2.3.2"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
nix = { version = "0.31", default-features = false, features = ["signal", "fs"] }
thiserror = "2"
fluent-bundle = "0.16"
unic-langid = "0.9.6"

[[bin]]
name = "zarathustra-textprobe"
path = "src/bin/textprobe.rs"

[[bin]]
name = "zarathustra"
path = "src/bin/app.rs"

[[bin]]
name = "zarathustra-powerprobe"
path = "src/bin/powerprobe.rs"
