[package]
name = "omero"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "omero-probe"
path = "src/main.rs"

[features]
emulator = ["omero-device/emulator"]

[dependencies]
omero-device = { path = "../omero-device" }
omero-engine = { path = "../omero-engine" }
anyhow = "1"

[[bin]]
name = "omero-textprobe"
path = "src/bin/textprobe.rs"

[[bin]]
name = "omero-reader"
path = "src/bin/reader.rs"
