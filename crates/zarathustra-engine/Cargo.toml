[package]
name = "zarathustra-engine"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
harfrust = "0.15"
skrifa = "0.49"
zeno = "0.3"
zarathustra-device = { path = "../zarathustra-device" }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42", features = ["escape-html"] }
percent-encoding = "2"
thiserror = "2"
cssparser = "0.38"
selectors = "0.42"
precomputed-hash = "0.1"
hyphenation = "0.8"
icu_segmenter = "2"
zune-jpeg = "0.5"
zune-png = "0.5"
zune-core = "0.5"
gif = { version = "0.14", default-features = false, features = ["std"] }
memchr = "2"
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts"] }

[dev-dependencies]
jpeg-encoder = "0.7.1"
