# Remote shell and file transfer, public keys only. The strings here are the English source;
# locales/<lang>.ftl translate them.
display_name = "SSH"
description = "Remote shell and file transfer, keys only"
plugin_version = "1.0.0"
format_version = 1

[service]
executable = "run"
start_at_boot = true
# The way back in when Zarathustra itself is broken.
start_in_recovery = true

[status]
executable = "status"

[[setting]]
id = "port"
kind = "choice"
label = "Port"
options = ["22", "2222", "8022"]
default_value = "22"

[[setting]]
id = "authorized_keys"
kind = "list"
label = "Authorized keys"
list_executable = "keys"
empty_label = "No keys. Copy your public key into an authorized_keys file in the Kindle's zarathustra/plugins/ssh folder (over USB), then turn the service on again."

[[action]]
menu_label = "Save diagnostics"
executable = "diagnose"
