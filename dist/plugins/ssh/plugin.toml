# Remote shell and file transfer, public keys only. Labels are shown as written (no
# translations yet).
display_name = "SSH"
description = "Accesso remoto e trasferimento file, solo con chiavi"
plugin_version = "1.0.0"
format_version = 1

[service]
executable = "run"
start_at_boot = true
# The way back in when Zarathustra itself is broken.
start_in_recovery = true

[status]
executable = "status"

[[setting]]
id = "port"
kind = "choice"
label = "Porta"
options = ["22", "2222", "8022"]
default_value = "22"

[[setting]]
id = "authorized_keys"
kind = "list"
label = "Chiavi autorizzate"
list_executable = "keys"
empty_label = "Nessuna chiave. Copia la tua chiave pubblica in un file authorized_keys nella cartella zarathustra/plugins/ssh del Kindle (via USB), poi riattiva il servizio."

[[action]]
menu_label = "Salva diagnostica"
executable = "diagnose"
